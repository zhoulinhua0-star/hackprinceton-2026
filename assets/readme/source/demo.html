<!doctype html>
<!-- README video poster: a real frame from the demo (1:15) with a play cue. Links to https://youtu.be/frTz_ULVTXY in the README. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 675px; overflow: hidden; }
  body { position: relative; font-family: Figtree, -apple-system, sans-serif; color: #1e2740; background: #f3eee2 url("demo-frame.jpg") center/cover no-repeat; }
  .cue { position: absolute; left: 40px; bottom: 40px; display: flex; align-items: center; gap: 14px; padding: 10px 22px 10px 10px; border-radius: 99px;
         background: #1e2740; color: #fffcf5; box-shadow: 0 18px 40px -18px rgba(13,19,38,.55); }
  .play { width: 52px; height: 52px; border-radius: 50%; background: #c8553d; display: grid; place-items: center; }
  .play svg { margin-left: 5px; }
  .cue b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .cue small { font-size: 15px; color: #c9cde0; }
</style></head><body>
<div class="cue">
  <div class="play"><svg width="21" height="24" viewBox="0 0 26 30"><path d="M0 0l26 15L0 30z" fill="#fffcf5"/></svg></div>
  <div><b>Watch the demo</b><small>3 min on a real iPhone</small></div>
</div>
</body></html>
